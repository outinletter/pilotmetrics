[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "pilot-briefing"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
OPS_INTEL_INTERVAL_HOURS = "24"
